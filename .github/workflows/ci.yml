name: CI and Firebase deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: firebase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:rules
      - run: npm run test:e2e

  preview:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: barbeariaclassea-9f2b4.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: barbeariaclassea-9f2b4
          VITE_FIREBASE_STORAGE_BUCKET: barbeariaclassea-9f2b4.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '714519979744'
          VITE_FIREBASE_APP_ID: '1:714519979744:web:d5771be44fa016c9a81285'
          VITE_FIREBASE_MEASUREMENT_ID: G-PKBWGQ92RF
          VITE_RECAPTCHA_ENTERPRISE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_KEY }}
          VITE_USE_EMULATORS: 'false'
          VITE_SPARK: 'true'
          VITE_SITE_URL: https://barbeariaclassea-9f2b4.web.app
      - run: npx firebase-tools hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project barbeariaclassea-9f2b4 --config firebase.spark.json --non-interactive

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_FIREBASE_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: barbeariaclassea-9f2b4.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: barbeariaclassea-9f2b4
          VITE_FIREBASE_STORAGE_BUCKET: barbeariaclassea-9f2b4.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '714519979744'
          VITE_FIREBASE_APP_ID: '1:714519979744:web:d5771be44fa016c9a81285'
          VITE_FIREBASE_MEASUREMENT_ID: G-PKBWGQ92RF
          VITE_RECAPTCHA_ENTERPRISE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_KEY }}
          VITE_USE_EMULATORS: 'false'
          VITE_SPARK: 'true'
          VITE_SITE_URL: https://barbeariaclassea-9f2b4.web.app
      - run: npx firebase-tools deploy --config firebase.spark.json --only firestore,hosting --project barbeariaclassea-9f2b4 --non-interactive
