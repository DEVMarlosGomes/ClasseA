<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Classe A Barbearia · Agende seu horário</title>
    <meta
      name="description"
      content="Corte, barba e acabamento com hora marcada. Escolha o barbeiro e o horário em menos de um minuto."
    />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Classe A" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Classe A Barbearia" />
    <meta property="og:title" content="Classe A Barbearia · Agende seu horário" />
    <meta
      property="og:description"
      content="Corte, barba e acabamento com hora marcada. Escolha o barbeiro e o horário em menos de um minuto."
    />
    <meta property="og:image" content="/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Hero assets are only preloaded on the landing page.
      if (location.pathname === '/') {
        for (const [href, type, srcset] of [
          ['/brand/logo.svg', 'image/svg+xml'],
          ['/images/interior-gray-1086.avif', 'image/avif', '/images/interior-gray-640.avif 640w, /images/interior-gray-1086.avif 1086w'],
        ]) {
          const l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = href; l.type = type; l.fetchPriority = 'high';
          if (srcset) { l.imageSrcset = srcset; l.imageSizes = '100vw'; }
          document.head.appendChild(l);
        }
      }
    </script>
    <style>
      html,body{background:#050505;color:#f5f1e8;margin:0}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif">Ative o JavaScript para agendar na Classe A Barbearia.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
